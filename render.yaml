services:
  - type: web
    name: rotina
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ROTINA_DATA_DIR
        value: /var/data
      - key: APP_URL
        sync: false
      - key: ALLOWED_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
    disk:
      name: rotina-data
      mountPath: /var/data
      sizeGB: 1
